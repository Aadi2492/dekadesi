services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dekadesi
      POSTGRES_USER: dekadesi
      POSTGRES_PASSWORD: change_me_local_only
    ports: ["5432:5432"]
    volumes: [dekadesi_pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [dekadesi_redisdata:/data]
volumes:
  dekadesi_pgdata:
  dekadesi_redisdata:
